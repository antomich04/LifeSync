<section class="h-full relative overflow-hidden rounded-2xl border border-border bg-card shadow-sm flex flex-col transition-all duration-300 hover:shadow-md hover:border-primary/20">
    <!-- Top accent bar -->
    <div class="h-1 w-full rounded-t-2xl" [ngClass]="config.theme.gradient"></div>

    <!-- Ambient glow -->
    <div class="absolute top-0 w-64 h-64 rounded-full blur-3xl pointer-events-none"
         [ngClass]="[config.theme.glow, config.theme.glowPosition]">
    </div>

    <div class="relative z-10 flex flex-col gap-6 p-6 md:p-8 flex-1">

        <!-- Agent header -->
        <div class="flex items-start gap-4">
            <div class="relative flex-shrink-0">
                <div class="w-16 h-16 rounded-2xl border flex items-center justify-center shadow-sm" [ngClass]="config.theme.iconBg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" [ngClass]="config.theme.iconText" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        @for (path of config.mainIconPaths; track $index) {
                            <path [attr.d]="path" />
                        }
                    </svg>
                </div>
                <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-green-500 border-2 border-card shadow-sm"></span>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                    <h2 class="text-lg font-bold tracking-tight text-foreground">{{ config.name }}</h2>
                    <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-full border" [ngClass]="[config.theme.badgeBg, config.theme.badgeText]">
                        {{ config.role }}
                    </span>
                </div>
                <p class="text-sm text-muted-foreground mt-0.5 leading-snug">{{ config.description }}</p>
            </div>
        </div>

        <!-- Capabilities -->
        <div class="flex flex-col gap-3">
            <p class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">{{ config.capabilitiesTitle }}</p>
            <div class="flex flex-col gap-2">
                @for (capability of config.capabilities; track capability.label) {
                <div class="flex items-start gap-3 p-3 rounded-xl bg-muted/50 border border-border/60">
                    <div class="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center mt-0.5" [ngClass]="config.theme.iconBg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" [ngClass]="config.theme.iconText" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path [attr.d]="capability.icon" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-foreground">{{ capability.label }}</p>
                        <p class="text-xs text-muted-foreground leading-relaxed mt-0.5">{{ capability.description }}</p>
                    </div>
                </div>
                }
            </div>
        </div>

        <!-- Sample output (Dynamic Content Projection) -->
        <div class="flex flex-col gap-3">
            <p class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">{{ config.sampleTitle }}</p>
            <ng-content></ng-content>
        </div>

        <!-- CTA Button -->
        <div class="mt-auto pt-2">
            <button (click)="onActivate()" [disabled]="state === 'loading'"
                class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl text-white font-semibold text-sm shadow-sm active:scale-95 transition-all duration-150 disabled:opacity-60 disabled:pointer-events-none cursor-pointer select-none"
                [ngClass]="config.theme.button">

                @if (state === 'loading') {
                    <svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    {{ config.buttonLoadingText }}
                } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path [attr.d]="config.buttonIconPath" />
                    </svg>
                    {{ config.buttonText }}
                }
            </button>
        </div>

    </div>
</section>
