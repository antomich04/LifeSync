<div class="mt-2 p-6 md:p-8 border shadow-sm rounded-2xl border-border bg-card flex flex-col gap-6">

    <div class="flex items-center justify-between">
        <div>
            <h3 class="text-xl font-semibold tracking-tight text-foreground">Historical Trends</h3>
            <p class="text-sm text-muted-foreground">Monthly AQI averages for {{ selectedYear() }}</p>
        </div>
    </div>

    <div class="h-[350px] w-full flex items-center justify-center">
        @if (errorMessage()) {
            <div class="flex flex-col items-center gap-2 text-muted-foreground bg-muted/30 p-6 rounded-lg border border-border border-dashed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 opacity-80"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                <p class="text-sm font-medium">{{ errorMessage() }}</p>
            </div>
        } @else {
            <canvas baseChart [data]="chartData()" [options]="lineChartOptions" [type]="'line'">
            </canvas>
        }
    </div>

    <nav class="w-full flex justify-center mt-2 border-t border-border pt-4">
        <ul class="flex flex-row items-center gap-1">

            <li>
                <button (click)="prevYear()" 
                        [disabled]="selectedYear() === availableYears()[0]" 
                        class="inline-flex items-center select-none justify-center cursor-pointer rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2 gap-1 disabled:opacity-50 disabled:pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m15 18-6-6 6-6"/></svg>
                    <span class="hidden sm:block">Previous</span>
                </button>
            </li>

            @for (year of availableYears(); track year) {
                <li class="hidden sm:block">
                    <button (click)="selectYear(year)"
                            class="inline-flex items-center select-none justify-center cursor-pointer rounded-md text-sm font-medium transition-colors h-9 w-9"
                            [class.bg-primary]="year === selectedYear()"
                            [class.text-primary-foreground]="year === selectedYear()"
                            [class.hover:bg-accent]="year !== selectedYear()"
                            [class.hover:text-accent-foreground]="year !== selectedYear()">
                        {{ year }}
                    </button>
                </li>
            }

            <li>
                <button (click)="nextYear()" 
                        [disabled]="selectedYear() === availableYears()[availableYears().length - 1]"
                        class="inline-flex items-center select-none justify-center cursor-pointer rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2 gap-1 disabled:opacity-50 disabled:pointer-events-none">
                    <span class="hidden sm:block">Next</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </li>

        </ul>
    </nav>

</div>
