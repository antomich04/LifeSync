<hlm-sheet side="right" [state]="sheetState()" (stateChanged)="sheetState.set($event)">

    <hlm-sheet-content *brnSheetContent="let ctx" side="right" class="w-[90vw] p-6 sm:p-8 sm:w-[540px] overflow-y-auto">

        <hlm-sheet-header>
            <h3 hlmSheetTitle class="flex items-center gap-2 text-xl font-bold">
                <span class="w-2.5 h-2.5 rounded-full bg-agent-iris animate-pulse"></span>
                {{ 'report.title' | translate }} {{ agentName() }}
            </h3>
            <p hlmSheetDescription>
                {{ 'report.description' | translate }}
            </p>
        </hlm-sheet-header>

        <div class="py-6">

            @if (agentName() === 'Iris') {
            <div class="prose prose-sm dark:prose-invert max-w-none report-markdown">
                <!-- Pass content through the translation sanitizer method -->
                <markdown [data]="translateMarkdown(markdownContent())" ngPreserveWhitespaces [disableSanitizer]="true">
                </markdown>
            </div>
            }

        </div>

        <hlm-sheet-footer>
            <button hlmSheetClose
                class="w-full select-none cursor-pointer px-4 py-2.5 mt-4 text-sm font-semibold transition-colors rounded-xl bg-secondary text-secondary-foreground hover:bg-secondary/80">
                {{ 'report.close' | translate }}
            </button>
        </hlm-sheet-footer>

    </hlm-sheet-content>
</hlm-sheet>
