<section class="flex flex-col gap-4">

    <div class="flex items-end justify-between px-1">
        <h2 class="lg:text-2xl md:text-lg sm:text-sm font-semibold tracking-tight text-foreground">Select your region</h2>
        <span class="text-xs text-muted-foreground pb-0.5">{{ allRegionsCount }} municipalities available</span>
    </div>

    <hlm-command class="w-full border shadow-sm rounded-2xl border-border bg-card overflow-hidden transition-all"
        (searchChange)="onSearch($event)" (focusout)="onFocusOut($event)" (click)="focusInput()">

        <hlm-command-input #commandInput placeholder="Search municipality…" />

        <hlm-command-list [class.hidden]="!isDropdownOpen()" class="max-h-[400px] border-t border-border">

            <div *hlmCommandEmptyState hlmCommandEmpty
                class="py-10 text-center text-sm text-muted-foreground">
                No municipality found.
            </div>

            <hlm-command-group>
                <button id="hidden-cmd-item" hlm-command-item value="-" class="hidden"></button>

                <hlm-command-group-label
                    class="text-muted-foreground text-xs uppercase tracking-wider py-3 px-6">
                    Thessaloniki Municipalities
                </hlm-command-group-label>

                @for (region of displayedRegions(); track region) {
                <button hlm-command-item [value]="region" (selected)="onRegionSelect(region)"
                    class="cursor-pointer px-6 py-3.5 text-base group">
                    <div class="flex items-center gap-3">
                        <div class="flex-shrink-0 w-7 h-7 rounded-lg bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-primary" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        {{ region }}
                    </div>
                </button>
                }
            </hlm-command-group>

        </hlm-command-list>
    </hlm-command>

</section>
