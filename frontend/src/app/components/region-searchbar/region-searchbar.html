<section class="flex flex-col gap-6">
    <h2 class="text-2xl font-semibold tracking-tight text-foreground px-1">Select your region</h2>

    <hlm-command class="w-full border shadow-sm rounded-2xl border-border bg-card overflow-hidden transition-all"
        (searchChange)="onSearch($event)" (focusin)="isDropdownOpen.set(true)" (focusout)="onFocusOut($event)">

        <hlm-command-input placeholder="Search municipality..." (click)="isDropdownOpen.set(true)" />

        <hlm-command-list [class.hidden]="!isDropdownOpen()" class="max-h-[400px] border-t border-border">

            <div *hlmCommandEmptyState hlmCommandEmpty class="py-10 text-center text-lg text-muted-foreground">No
                region found.</div>

            <hlm-command-group>
                <button id="hidden-cmd-item" hlm-command-item value="-" class="hidden"></button>

                <hlm-command-group-label class="text-muted-foreground text-xs uppercase tracking-wider py-3 px-6">
                    Thessaloniki Municipalities
                </hlm-command-group-label>

                @for (region of displayedRegions(); track region) {
                <button hlm-command-item [value]="region" (selected)="onRegionSelect(region)"
                    class="cursor-pointer px-6 py-4 text-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-4 text-primary" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    {{ region }}
                </button>
                }
            </hlm-command-group>
        </hlm-command-list>
    </hlm-command>
</section>
