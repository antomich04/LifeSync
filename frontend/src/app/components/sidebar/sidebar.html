<hlm-sidebar
    class="border-sidebar-border bg-gradient-to-b from-sidebar to-primary/75 text-sidebar-foreground flex flex-col">

    <div hlmSidebarHeader class="cursor-pointer">
        <hlm-card size="sm" (click)="closeMobileSidebar()"
            class="ring-0 shadow-none bg-sidebar-accent/80 border-transparent hover:bg-sidebar-accent/60 transition-colors"
            routerLink="/">
            <div hlmCardContent class="flex items-center justify-center p-4">
                <img src="logo.png" alt="LifeSync Logo" class="w-40 select-none drop-shadow-md">
            </div>
        </hlm-card>
    </div>

    <div hlmSidebarContent class="flex-1 px-3 pt-6">
        <div hlmSidebarGroup class="flex flex-col gap-1.5">

            <button hlmBtn variant="ghost" (click)="closeMobileSidebar()"
                class="flex items-center gap-3 w-full justify-start p-2.5 rounded-md cursor-pointer transition-all duration-300 border border-sidebar-foreground/10 bg-sidebar-foreground/5 text-sidebar-foreground/85 shadow-sm hover:bg-sidebar-accent hover:text-sidebar-accent-foreground hover:border-sidebar-primary/50 hover:shadow-md"
                routerLink="/dashboard"
                routerLinkActive="!bg-sidebar-accent !text-sidebar-accent-foreground !border-sidebar-primary/50 font-medium !shadow-[inset_4px_0_0_0_var(--sidebar-primary)]"
                #rlaDashboard="routerLinkActive">
                <div class="flex-shrink-0 w-9 h-9 rounded-md flex items-center justify-center transition-colors"
                    [class.bg-sidebar-primary/20]="rlaDashboard.isActive">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"
                        [class.text-sidebar-primary]="rlaDashboard.isActive">
                        <rect width="7" height="9" x="3" y="3" rx="1" />
                        <rect width="7" height="5" x="14" y="3" rx="1" />
                        <rect width="7" height="9" x="14" y="12" rx="1" />
                        <rect width="7" height="5" x="3" y="16" rx="1" />
                    </svg>
                </div>
                <div class="flex flex-col items-start leading-tight flex-1 min-w-0">
                    <span class="text-sm truncate w-full text-left">{{ 'sidebar.dashboard.title' | translate }}</span>
                    <span class="text-xs text-sidebar-foreground/50 font-normal truncate w-full text-left">{{
                        'sidebar.dashboard.subtitle' | translate }}</span>
                </div>
            </button>

            <button hlmBtn variant="ghost" (click)="closeMobileSidebar()"
                class="flex items-center gap-3 w-full justify-start p-2.5 rounded-md cursor-pointer transition-all duration-300 border border-sidebar-foreground/10 bg-sidebar-foreground/5 text-sidebar-foreground/85 shadow-sm hover:bg-sidebar-accent hover:text-sidebar-accent-foreground hover:border-sidebar-primary/50 hover:shadow-md"
                routerLink="/forecast"
                routerLinkActive="!bg-sidebar-accent !text-sidebar-accent-foreground !border-sidebar-primary/50 font-medium !shadow-[inset_4px_0_0_0_var(--sidebar-primary)]"
                #rlaForecast="routerLinkActive">
                <div class="flex-shrink-0 w-9 h-9 rounded-md flex items-center justify-center transition-colors"
                    [class.bg-sidebar-primary/20]="rlaForecast.isActive">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"
                        [class.text-sidebar-primary]="rlaForecast.isActive">
                        <path d="M12 16v5" />
                        <path d="M16 14v7" />
                        <path d="M20 10v11" />
                        <path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15" />
                        <path d="M4 18v3" />
                        <path d="M8 14v7" />
                    </svg>
                </div>
                <div class="flex flex-col items-start leading-tight flex-1 min-w-0">
                    <span class="text-sm truncate w-full text-left">{{ 'sidebar.forecast.title' | translate }}</span>
                    <span class="text-xs text-sidebar-foreground/50 font-normal truncate w-full text-left">{{
                        'sidebar.forecast.subtitle' | translate }}</span>
                </div>
            </button>

            <button hlmBtn variant="ghost" (click)="closeMobileSidebar()"
                class="flex items-center gap-3 w-full justify-start p-2.5 rounded-md cursor-pointer transition-all duration-300 border border-sidebar-foreground/10 bg-sidebar-foreground/5 text-sidebar-foreground/85 shadow-sm hover:bg-sidebar-accent hover:text-sidebar-accent-foreground hover:border-sidebar-primary/50 hover:shadow-md"
                routerLink="/advisors"
                routerLinkActive="!bg-sidebar-accent !text-sidebar-accent-foreground !border-sidebar-primary/50 font-medium !shadow-[inset_4px_0_0_0_var(--sidebar-primary)]"
                #rlaAdvisors="routerLinkActive">
                <div class="flex-shrink-0 w-9 h-9 rounded-md flex items-center justify-center transition-colors"
                    [class.bg-sidebar-primary/20]="rlaAdvisors.isActive">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"
                        [class.text-sidebar-primary]="rlaAdvisors.isActive">
                        <path d="M12 8V4H8" />
                        <rect width="16" height="12" x="4" y="8" rx="2" />
                        <path d="M2 14h2" />
                        <path d="M20 14h2" />
                        <path d="M15 13v2" />
                        <path d="M9 13v2" />
                    </svg>
                </div>
                <div class="flex flex-col items-start leading-tight flex-1 min-w-0">
                    <span class="text-sm truncate w-full text-left">{{ 'sidebar.advisors.title' | translate }}</span>
                    <span class="text-xs text-sidebar-foreground/50 font-normal truncate w-full text-left">{{
                        'sidebar.advisors.subtitle' | translate }}</span>
                </div>
            </button>

            <button hlmBtn variant="ghost" (click)="closeMobileSidebar()"
                class="flex items-center gap-3 w-full justify-start p-2.5 rounded-md cursor-pointer transition-all duration-300 border border-sidebar-foreground/10 bg-sidebar-foreground/5 text-sidebar-foreground/85 shadow-sm hover:bg-sidebar-accent hover:text-sidebar-accent-foreground hover:border-sidebar-primary/50 hover:shadow-md"
                routerLink="/support"
                routerLinkActive="!bg-sidebar-accent !text-sidebar-accent-foreground !border-sidebar-primary/50 font-medium !shadow-[inset_4px_0_0_0_var(--sidebar-primary)]"
                #rlaSupport="routerLinkActive">
                <div class="flex-shrink-0 w-9 h-9 rounded-md flex items-center justify-center transition-colors"
                    [class.bg-sidebar-primary/20]="rlaSupport.isActive">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"
                        [class.text-sidebar-primary]="rlaSupport.isActive">
                        <path
                            d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                        <line x1="12" x2="12.01" y1="17" y2="17" />
                    </svg>
                </div>
                <div class="flex flex-col items-start leading-tight flex-1 min-w-0">
                    <span class="text-sm truncate w-full text-left">{{ 'sidebar.support.title' | translate }}</span>
                    <span class="text-xs text-sidebar-foreground/50 font-normal truncate w-full text-left">{{
                        'sidebar.support.subtitle' | translate }}</span>
                </div>
            </button>

        </div>
    </div>

    <div hlmSidebarHeader class="mt-auto px-3 pb-4 pt-3 border-t border-sidebar-foreground/10">
        <div class="flex items-center justify-between gap-2 px-1">
            <div class="flex flex-col gap-0.5 min-w-0">
                <span
                    class="text-xs font-semibold text-sidebar-foreground/80 uppercase tracking-wider truncate">LifeSync</span>
                <span class="text-xs text-sidebar-foreground/60 truncate">{{ 'sidebar.location' | translate }}</span>
            </div>

            <div class="flex items-center rounded-full border border-sidebar-foreground/20 bg-sidebar-foreground/8 p-0.5 shrink-0"
                role="group" aria-label="Language toggle">
                <button type="button" (click)="setLanguage('en')"
                    [class.bg-sidebar-primary]="languageService.currentLanguage() === 'en'"
                    [class.text-sidebar-primary-foreground]="languageService.currentLanguage() === 'en'"
                    [class.text-sidebar-foreground/50]="languageService.currentLanguage() !== 'en'"
                    class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all duration-150 leading-none">
                    EN
                </button>
                <button type="button" (click)="setLanguage('el')"
                    [class.bg-sidebar-primary]="languageService.currentLanguage() === 'el'"
                    [class.text-sidebar-primary-foreground]="languageService.currentLanguage() === 'el'"
                    [class.text-sidebar-foreground/50]="languageService.currentLanguage() !== 'el'"
                    class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all duration-150 leading-none">
                    GR
                </button>
            </div>
        </div>
    </div>

</hlm-sidebar>
