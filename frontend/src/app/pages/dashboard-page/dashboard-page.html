<div class="flex flex-col gap-8 p-6 md:p-10 max-w-7xl mx-auto">

    <!-- Banner section -->
    <section
        class="relative overflow-hidden rounded-2xl bg-primary text-primary-foreground shadow-md transition-all duration-300">

        <div
            class="absolute -top-32 -right-32 w-[30rem] h-[30rem] bg-white/10 rounded-full blur-3xl pointer-events-none">
        </div>
        <div class="absolute -bottom-16 -left-16 w-64 h-64 bg-accent/20 rounded-full blur-2xl pointer-events-none">
        </div>

        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-8 p-8 md:p-12">

            <div class="max-w-2xl space-y-3">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 mb-2 text-sm font-medium rounded-full bg-primary-foreground/10 text-primary-foreground">
                    <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                    Operational Status: Live
                </div>

                <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">
                    Environmental Analytics Overview
                </h1>

                <p class="text-lg text-primary-foreground/80 leading-relaxed">
                    Monitor the atmospheric health of your urban environment in real-time. Select a municipality below
                    to generate localized air quality indices and review historical concentration trends.
                </p>
            </div>

            <div
                class="hidden md:flex flex-shrink-0 items-center justify-center w-28 h-28 rounded-full bg-primary-foreground/5 border border-primary-foreground/10 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="w-10 h-10 transition-transform duration-500 hover:scale-110">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                </svg>
            </div>

        </div>
    </section>

    <ls-region-search (regionSelected)="onRegionSelect($event)"></ls-region-search>

    @if (selectedRegion()) {
    <div class="flex flex-col gap-6 animate-in fade-in slide-in-from-bottom-4 duration-500">

        <ls-live-data-card [region]="selectedRegion()!"></ls-live-data-card>

        <ls-historical-chart [region]="selectedRegion()!"></ls-historical-chart>

    </div>
    }

</div>
